name: Build Aso4Mail Windows (unverified test)
on:
  workflow_dispatch:
  push:
    branches: [main, feature/outlook-like-redesign, feature/aso4mail-pro]
    paths:
      - '**/*.cs'
      - '**/*.xaml'
      - '**/*.csproj'
      - '.github/workflows/windows-build.yml'
permissions:
  contents: read
jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and audit dependencies
        shell: pwsh
        run: dotnet restore Aso4Mail.csproj -p:NuGetAudit=true -p:NuGetAuditLevel=moderate
      - name: Build
        shell: pwsh
        run: dotnet build Aso4Mail.csproj -c Release --no-restore
      - name: Publish unsigned test EXE
        shell: pwsh
        run: dotnet publish Aso4Mail.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:EnableWindowsTargeting=true -o publish
      - name: SHA256 report
        shell: pwsh
        run: |
          Get-FileHash publish/Aso4Mail.exe -Algorithm SHA256 | Format-List | Out-File publish/SHA256.txt
          Get-Content publish/SHA256.txt
      - name: Upload test artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aso4Mail-Windows-x64-UNVERIFIED
          path: publish/
          if-no-files-found: error
          retention-days: 7
